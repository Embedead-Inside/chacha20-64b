name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: make test CC=${{ matrix.cc }}
      - name: UBSan / ASan
        run: make test CC=${{ matrix.cc }} CFLAGS="-std=c99 -Wall -Wextra -O1 -g -fsanitize=undefined,address"
